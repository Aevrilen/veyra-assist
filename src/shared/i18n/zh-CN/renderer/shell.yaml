legal:
  declaration:
    title: 声明
    isFree: 为免费软件
    ok: 我已知晓此软件{isFree}并已认同免责条款
    quit: 退出
    newContent: |
      <div class="akari-disclaimer">

      <style>
      .akari-disclaimer{
        background-color:#ffffff;
        color:#333333;
        line-height:1.65;
        padding:1.75rem 2rem;
        box-shadow:0 2px 6px rgba(0,0,0,.15);
      }
      .akari-disclaimer h1,
      .akari-disclaimer h2{
        color:#d97706;
        margin-top:1.5rem;
        margin-bottom:.75rem;
        line-height:1.25;
      }
      .akari-disclaimer h1{font-size:1.6rem;}
      .akari-disclaimer h2{font-size:1.25rem;}
      .akari-disclaimer ul{margin-left:1.5rem;}
      .akari-disclaimer li{margin-bottom:.65rem;}
      .akari-disclaimer a{color:#2563eb;text-decoration:none;}
      .akari-disclaimer a:hover{text-decoration:underline;}
      [data-theme='dark'] .akari-disclaimer{
        background-color:#1e1e1e;
        color:#e6e6e6;
        box-shadow:0 2px 6px rgba(0,0,0,.35);
      }
      [data-theme='dark'] .akari-disclaimer h1,
      [data-theme='dark'] .akari-disclaimer h2{
        color:#ffd866;
      }
      [data-theme='dark'] .akari-disclaimer a{
        color:#8ab4f8;
      }
      </style>

      # $t(common:appName) 用户须知与免责声明

      > **请在下载、安装或使用本软件之前，务必仔细阅读并充分理解本须知与免责声明。**
      > 一旦您开始使用，即视为已充分理解并同意下列全部条款。

      ---

      ## 一、软件性质与获取途径
      - **$t(common:appName)** 为完全开源、免费之软件，所有功能均以「按现状」方式公开提供。
      - 本软件并未以**任何**方式公开售卖，如遇倒卖、捆绑销售或其他牟利形式，请勿购买，若购买请**立即退款**。

      ## 免责声明
      本项目免费开源，目前仍在持续完善。请自行评估使用风险，我们无法对账号风险作出保证。如遇功能异常，可通过日志反馈协助排查。

      ## 三、服务器兼容性声明
      - **自本声明发布之日起，$t(common:appName) 不再对腾讯游戏服务器提供任何形式的支持。**
      - 在腾讯服务器环境中使用本软件**极有可能**违反腾讯游戏相关用户协议、管理规范或技术保护措施；由此产生的封号、数据丢失或其他不利后果，概由用户自行负责。

      ## 四、信息收集与隐私保护
      - 为改进产品质量、分析错误及进行安全统计，软件运行时将收集**必要且有限**的系统信息与崩溃日志。
      - 所收集信息**不含**可识别个人身份之数据，不会上传至任何第三方服务器，亦不会用于商业用途。

      ## 五、其他事项
      - 连续使用右键点击三次确认按钮，可快速关闭这个页面，同时视为您已经阅读并同意本须知与免责声明。

      ---

      > **如您对本须知与免责声明存在任何疑问，或需要进一步了解软件详情，请访问**
      > <https://github.com/LeagueAkari/LeagueAkari> 。

      </div>
